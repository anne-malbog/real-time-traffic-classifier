# ByteTrack config tuned for traffic video, not generic fast-paced MOT.
# Based on Ultralytics' bytetrack.yaml defaults (see .venv's copy for the
# stock version + inline comments); the one deliberate change is
# track_buffer, justified by an observed failure during Phase 3 verification:
# a fully STATIONARY parked car (in a since-removed sample clip — see the
# README's Dataset section for the current sample set) still switched track
# IDs partway through a 106s clip, most likely because a
# brief confidence dip (moving tree-shadow, momentary occlusion by a passing
# vehicle) exceeded the default 30-frame (~1.2s at 25fps) buffer and the
# track was dropped and re-born as a new id.
#
# Traffic scenes don't need the aggressive/fast-reacting behavior tuned for
# generic pedestrian/sports MOT benchmarks — vehicles don't disappear and
# reappear rapidly — so a longer buffer trades a small amount of extra
# compute/memory for fewer false "new vehicle" IDs on genuinely short
# occlusions, which directly matters for Phase 4 counting accuracy (an ID
# switch = a vehicle double-counted).
#
# HONEST CAVEAT (verified during Phase 3): this buffer increase alone did NOT
# fix the specific failure that motivated it. Diagnostic script found the
# same parked car switching ids 1->16->18->24->25->29->58 over frames
# 900-1350 (~18s) with track_buffer=90 just as with the stock 30 — because
# that failure is a ~15s burst of detection dropouts (likely a passing
# vehicle/shadow event), far longer than any reasonable buffer, not a single
# short gap. Swapping to BoT-SORT (which adds camera-motion compensation)
# hit the *same* churn window with a near-identical id sequence, confirming
# the root cause is upstream in detection confidence, not tracker
# association logic. Kept as the default anyway — still a real, low-cost
# improvement for genuine short occlusions (e.g. one vehicle briefly hidden
# behind another for 1-2s) — but this specific multi-second dropout pattern
# is a documented limitation, not something tracker-side tuning fixes. See
# the README's Limitations section.

tracker_type: bytetrack
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25
track_buffer: 90 # ~3.6s at 25fps, ~3s at 30fps — was 30 (~1.2s) in the stock config
match_thresh: 0.8
fuse_score: True
