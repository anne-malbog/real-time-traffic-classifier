# Scene-specific analytics configuration for data/raw/samples/tenth_avenue_daytime.ogv
# (1280x720 container, but the actual video content is letterboxed within
# roughly x:[152,1126] y:[36,683] — verified by scanning for non-black pixels,
# not assumed; all coordinates below are chosen within that visible region).
# Elevated fixed camera over 10th Avenue, Manhattan, daytime, 733 real frames.
#
# Use with: --source data/raw/samples/tenth_avenue_daytime.ogv --scene-config configs/analytics_tenth_avenue.yaml
#
# IMPORTANT — this clip is a TIME-LAPSE (sped up from its original capture rate).
# Detection, tracking, and counting remain valid (they only depend on what's
# visible per frame), but real-elapsed-time-dependent features are NOT: no
# speed_calibration is defined here, and any dwell-time-based read (stopped_vehicle
# duration) should be treated as approximate at best. See docs/failure_analysis.md
# case #5 for the full reasoning — this is a documented, deliberate omission, not
# an oversight. (This clip's own metadata — 733 frames, 24fps — is one of the rare
# exceptions in this project that looks internally consistent, but the time-lapse
# caveat is about real-world elapsed time vs. capture rate, not container metadata
# trustworthiness, so it applies regardless.)
#
# See configs/analytics.yaml (the primary, highway_night.webm config) for the full
# commentary on why every value here is scene-specific and must be recalibrated per
# camera — not repeated here.

counting_lines:
  - name: main_line
    point1: [420, 440]
    point2: [800, 440]
    direction_a_label: "toward camera"
    direction_b_label: "away from camera"

density:
  thresholds:
    - {max: 10, label: LOW}
    - {max: 25, label: MODERATE}
    - {max: 40, label: HIGH}
    - {max: null, label: CONGESTED}

congestion:
  density_trigger: HIGH
  slow_speed_px_per_sec: 15.0
  min_slow_fraction: 0.5

direction:
  reference: screen

# ENABLED — the first sample clip in this project where this is actually valid.
# 10th Avenue is one-way southbound here: every vehicle across multiple checked
# frames shows a rear profile (taillights facing camera), consistently moving
# away from camera (screen-relative "UP", toward the vanishing point) with no
# oncoming traffic in any lane — unlike every other clip in this project, which
# has two-way/multi-carriageway traffic and keeps this disabled for exactly that
# reason (see configs/analytics.yaml and configs/analytics_golden_gate.yaml).
wrong_way:
  expected_direction: UP
  min_consecutive_frames: 5
  tolerance_steps: 1

stopped_vehicle:
  movement_threshold_px: 10.0
  min_stopped_duration_sec: 5.0

restricted_zones:
  - name: fire_lane_no_stopping
    # The painted "FIRE LANE" marking in the near lane — a real, literal
    # no-stopping zone, not an estimated/inferred one.
    polygon: [[520, 545], [700, 545], [700, 650], [520, 650]]

# No speed_calibration — see the time-lapse note at the top of this file.
